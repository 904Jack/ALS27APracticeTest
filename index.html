<style>

body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}

h1{font-size:1.4rem;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}

button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}

</style></head><body><main><div id="app"></div></main>
<script>
// Each item: [question, [correct, wrong, wrong, wrong], explanation]
var Q=[
["Which law created the National Security Council, the CIA, and the Department of the Air Force?",["National Security Act of 1947","Goldwater-Nichols Act of 1986","Posse Comitatus Act","Defense Authorization Act of 1961"],"The National Security Act of 1947 reorganized the defense establishment and created the NSC, CIA, and the Air Force as a separate Service."],
["What was a main purpose of the Goldwater-Nichols Act of 1986?",["Strengthen joint operations and clarify the chain of command","Create the Department of the Air Force","Establish the all-volunteer force","Limit the military’s role in civil support"],"Goldwater-Nichols improved joint operations, strengthened the Chairman’s advisory role, and clarified command authority to the combatant commanders."],
["Which is the operational chain of command?",["President → SecDef → Combatant Commanders","President → SecDef → Service Secretaries → Service Chiefs","President → Chairman → Combatant Commanders","SecDef → Chairman → Service Chiefs"],"The operational chain runs from the President to the SecDef to the CCDRs, who command forces in their areas or functions."],
["Which is the administrative chain of command?",["President → SecDef → Service Secretaries → Service Chiefs → forces","President → SecDef → Combatant Commanders","President → Chairman of the Joint Chiefs → Service Chiefs","Congress → SecDef → Service Chiefs"],"The administrative chain runs through the Service Secretaries and Service Chiefs, who organize, train, and equip forces."],
["The Chairman of the Joint Chiefs of Staff is:",["The principal military adviser to the President, outside the chain of command","The commander of all combatant commands","The senior Service Secretary","The head of the National Guard"],"The Chairman advises the President, SecDef, and NSC but does not command forces."],
["Which official is a member of the Joint Chiefs of Staff?",["Chief of the National Guard Bureau","Commander, USINDOPACOM","Secretary of the Air Force","Director of the CIA"],"The JCS includes the Chairman, Vice Chairman, each Service Chief, and the Chief of the National Guard Bureau. Combatant commanders and Service Secretaries are not members."],
["Which of these is a functional combatant command?",["US Transportation Command","US Central Command","US Africa Command","US Southern Command"],"TRANSCOM is functional. CENTCOM, AFRICOM, and SOUTHCOM are geographic commands."],
["Which combatant command covers the Middle East region?",["US Central Command (CENTCOM)","US European Command","US Northern Command","US Strategic Command"],"CENTCOM’s geographic area of responsibility centers on the Middle East and parts of Central and South Asia."],
["Which combatant command is responsible for strategic deterrence, including nuclear forces?",["US Strategic Command (STRATCOM)","US Special Operations Command","US Transportation Command","US Southern Command"],"STRATCOM is a functional command responsible for strategic deterrence and global strike capabilities."],
["Which command provides global air, land, and sea transportation for the DoD?",["US Transportation Command","US Special Operations Command","US Cyber Command","US Space Command"],"TRANSCOM is the functional command for global mobility and distribution."],
["Which command is the lead for homeland defense of the continental United States?",["US Northern Command (NORTHCOM)","US Southern Command","US Indo-Pacific Command","US Strategic Command"],"NORTHCOM defends the homeland and provides support to civil authorities in its area of responsibility."],
["Homeland defense is best defined as:",["Protecting US sovereignty, territory, population, and critical infrastructure against external threats","Helping local authorities after a natural disaster","Enforcing civilian laws within the US","Training partner nations’ militaries"],"Homeland defense counters external threats. Responding to disasters is civil support."],
["Which is an example of civil support?",["Military helicopters assisting hurricane relief at a governor’s request","Intercepting a hostile aircraft approaching US airspace","Conducting an overseas strike","Deterring a nuclear attack"],"Civil support is DoD support to civil authorities for domestic emergencies, in a supporting role."],
["In civil support missions, the military generally acts in what role?",["Supporting a lead civilian agency","Leading all response efforts","Replacing local law enforcement","Commanding state governments"],"The military supports civil authorities. A civilian lead agency normally directs the response."],
["What is the primary responsibility of the Military Services?",["Organize, train, and equip forces","Command forces in combat operations","Set national security policy","Direct interagency partners"],"Services provide trained and equipped forces to combatant commanders, who employ them."],
["Which Service is primarily responsible for prompt and sustained land combat?",["Army","Marine Corps","Air Force","Space Force"],"The Army’s core role is prompt and sustained land combat."],
["Which Service is organized as an expeditionary, amphibious force-in-readiness?",["Marine Corps","Army","Coast Guard","Air Force"],"The Marine Corps provides forces that can deploy rapidly, including amphibious operations."],
["Which is a core mission of the Air Force?",["Rapid global mobility","Amphibious assault","Sustained land combat","Maritime blockade"],"Air Force core missions include air superiority, global strike, rapid global mobility, ISR, and command and control."],
["The primary mission of the US Space Force is to:",["Organize, train, and equip space forces to protect US and allied interests in space","Conduct amphibious operations","Provide domestic law enforcement","Operate the nation’s strategic ground forces"],"The Space Force is the Service responsible for space forces and operations."],
["In peacetime the US Coast Guard operates under which department?",["Department of Homeland Security","Department of Defense","Department of State","Department of Justice"],"The Coast Guard is under DHS in peacetime and can be transferred to the Navy during war or by presidential direction."],
["What does JIIM stand for?",["Joint, Interagency, Intergovernmental, Multinational","Joint, Intelligence, International, Military","Joint, Interagency, Industrial, Multinational","Joint, Integrated, Intergovernmental, Mobile"],"JIIM describes the broad set of partners involved in unified action."],
["Which is an example of an interagency partner?",["Department of State","A state governor","NATO","A county sheriff"],"Interagency partners are US federal departments and agencies, such as State, DHS, or Justice."],
["Which is an example of an intergovernmental partner?",["A state or local government","Department of State","The Air Force Reserve","A defense contractor"],"Intergovernmental refers to state, local, tribal, and territorial governments (and also international organizations in some definitions)."],
["Which is an example of a multinational partner?",["NATO forces","The Department of Homeland Security","A state National Guard","The CIA"],"Multinational means forces and governments of other nations working together."],
["Unified action refers to:",["Synchronizing military and nonmilitary efforts to achieve unity of effort","Combining the military Services into one","Transferring control of forces to the UN","Training with allies once a year"],"Unified action is the coordination of joint, interagency, intergovernmental, and multinational efforts."],
["The oath of enlistment is sworn to:",["Support and defend the Constitution","The President personally","The enlisted member’s commander","The Service Chief"],"The oath is to the Constitution, not to any individual."],
["Under the oath, enlisted members obey the orders of whom?",["The President and the officers appointed over them, according to regulations and the UCMJ","Any senior member","Only their immediate supervisor","Any civilian official"],"Obedience is bound by regulations and the UCMJ, which means unlawful orders must not be followed."],
["Which branch of government has the power to declare war?",["Congress","The President","The Supreme Court","The Joint Chiefs"],"Congress declares war. The President is the Commander in Chief."],
["Why does the US maintain civilian control of the military?",["To ensure the military serves elected leaders and the Constitution","Because the military lacks expertise","To limit the size of the force","To give the states command of the Services"],"Civilian control keeps the armed forces accountable to elected officials."],
["What are the Air Force core values?",["Integrity First, Service Before Self, Excellence in All We Do","Honor, Courage, Commitment","Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, Personal Courage","Character, Connection, Commitment, Courage"],"Integrity First, Service Before Self, and Excellence in All We Do are the Air Force core values."],
["Honor, Courage, and Commitment are the core values of which Services?",["Navy and Marine Corps","Army","Air Force","Coast Guard"],"The Navy and Marine Corps share these core values."],
["Which Service uses the core values Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, and Personal Courage?",["Army","Navy","Space Force","Marine Corps"],"These seven values (LDRSHIP) are the Army’s core values."],
["The Space Force core values are:",["Character, Connection, Commitment, Courage","Honor, Courage, Commitment","Honor, Respect, Devotion to Duty","Integrity First, Service Before Self, Excellence"],"The Space Force values are Character, Connection, Commitment, and Courage."],
["What most distinguishes the Profession of Arms?",["A voluntary commitment to selfless service, including willingness to sacrifice","High pay and benefits","Rapid promotion opportunities","Freedom from legal constraints"],"The profession is defined by an ethic of service and the willingness to defend the nation."],
["Which best describes commander’s intent?",["The purpose, key tasks, and desired end state of an operation","A detailed step-by-step plan","A list of required equipment","The administrative chain of command"],"Intent lets subordinates exercise disciplined initiative when the plan no longer fits the situation."],
["Which is a principle of mission command?",["Disciplined initiative within the commander’s intent","Centralized control of every decision","Waiting for orders before acting","Avoiding all risk"],"Mission command relies on trust, shared understanding, a clear intent, and disciplined initiative."],
["Which is a core responsibility of an NCO?",["Accomplishing the mission while taking care of people","Making policy for the unit","Avoiding responsibility for subordinates’ conduct","Leaving discipline to officers"],"NCOs enforce standards, develop Airmen, and accomplish the mission."],
["You’re told to sign off on an inspection item you know was not completed. What’s the best action?",["Decline to sign and report the issue to the chain of command","Sign it to avoid conflict","Sign it and fix it later","Ignore it and say nothing"],"Integrity First means refusing to falsify records and raising the issue through proper channels."],
["Why does each Service member’s conduct matter in international operations?",["They represent the United States and affect relationships with partners","Only officers influence foreign relations","Conduct matters only in combat","It doesn’t, because diplomats handle everything"],"Every member is a representative of the nation, and their conduct can strengthen or damage partnerships."],
["Which organization directly supports the Chairman in carrying out his or her responsibilities?",["The Joint Staff","The National Security Council staff","The Service Secretaries","The combatant command staffs"],"The Joint Staff assists the Chairman in providing strategic direction and advice. It is separate from the NSC staff."],
["The Secretary of Defense is best described as:",["The principal defense policy adviser to the President, with authority over the DoD","The senior uniformed officer of the military","A member of the Joint Chiefs of Staff","The commander of the National Guard"],"The SecDef is a civilian who exercises authority, direction, and control over the Department of Defense."],
["What does the Unified Command Plan do?",["Establishes combatant commands and assigns their missions and areas of responsibility","Sets the annual defense budget","Defines the Services’ uniform standards","Assigns enlisted members to duty stations"],"The UCP is the document that creates the CCMDs and defines their responsibilities and geographic boundaries."],
["US Indo-Pacific Command’s geographic area of responsibility centers on:",["The Asia-Pacific region","Europe","Africa","Central and South America"],"INDOPACOM covers the Indo-Pacific region, including much of the Pacific and Indian Oceans."],
["Which command is responsible for Europe and parts of Eurasia?",["US European Command (EUCOM)","US Central Command","US Africa Command","US Northern Command"],"EUCOM is the geographic combatant command for Europe and portions of Eurasia."],
["Which command covers Central and South America and the Caribbean?",["US Southern Command (SOUTHCOM)","US Northern Command","US Africa Command","US Central Command"],"SOUTHCOM’s area of responsibility is Central and South America and the Caribbean."],
["Which functional command provides special operations forces drawn from all Services?",["US Special Operations Command (SOCOM)","US Transportation Command","US Strategic Command","US Northern Command"],"SOCOM organizes, trains, and equips special operations forces from across the Services."],
["US Cyber Command’s mission primarily involves:",["Operating and defending DoD networks and conducting cyberspace operations","Global transportation","Nuclear deterrence","Homeland air defense"],"CYBERCOM is the functional command for cyberspace operations."],
["The Posse Comitatus Act generally prohibits:",["Using the federal military to execute civilian law enforcement","Deploying troops overseas","Supporting disaster relief","Training with allies"],"The act limits the use of the military for domestic law enforcement, which shapes how civil support is conducted."],
["National Guard forces under the control of their state governor are typically:",["In state status, supporting state missions","Under the Chairman’s command","Part of the Coast Guard","Under the Secretary of State"],"The Guard has a dual role. Governors direct it in state status, and the President can federalize it."],
["Which department is the Space Force part of?",["Department of the Air Force","Department of the Navy","Department of Homeland Security","Department of the Army"],"The Space Force is a separate Service organized within the Department of the Air Force."],
["Which Service is primarily responsible for sea control and maritime power projection?",["Navy","Army","Air Force","Coast Guard"],"The Navy maintains and employs naval forces to control the seas and project power."],
["A joint operation is best defined as:",["Military activity by forces of two or more Services under a single commander","Operations with only allied nations","Any operation led by the Air Force","Training conducted by one Service"],"Joint means two or more Military Departments operating together."],
["Which federal agency leads the national response to disasters and falls under DHS?",["FEMA","The CIA","The Department of State","US Transportation Command"],"FEMA coordinates federal disaster response, and the military supports it when requested."],
["Which part of the Constitution gives Congress the power to raise and support armies?",["Article I","Article II","Article III","The Second Amendment"],"Article I lists Congress’s powers, including raising armies and declaring war. Article II makes the President Commander in Chief."],
["What is the purpose of the separation of powers in the Constitution?",["To prevent any one branch from becoming too powerful","To give the military control of foreign policy","To let states command the armed forces","To merge executive and legislative authority"],"Dividing authority among three branches provides checks and balances."],
["What does the oath say enlisted members will defend the Constitution against?",["All enemies, foreign and domestic","Foreign enemies only","Any political party","Any who disobey the President"],"The oath says to defend the Constitution against all enemies, foreign and domestic."],
["You receive an order you believe is clearly unlawful. What is the best response?",["Do not follow it and report it through proper channels","Follow it because orders are always lawful","Follow it and complain later","Pass it to a subordinate"],"Members are obligated to obey lawful orders only. An unlawful order must be refused and raised through the chain of command or legal counsel."],
["Why is shared understanding important in mission command?",["It lets subordinates act with a common picture of the mission and intent","It removes the need for leaders","It guarantees no risk","It makes planning unnecessary"],"Shared understanding and mutual trust allow decentralized action that still supports the commander’s intent."],
["An NCO’s role in mission command is best described as:",["Translating the commander’s intent into clear tasks and empowering the team","Making all decisions personally","Waiting for officers to resolve every problem","Ignoring the commander’s intent when it is inconvenient"],"NCOs connect intent to execution, develop trust, and encourage disciplined initiative."],
["Which best describes the Air Force core value Integrity First?",["Doing the right thing even when no one is watching","Putting the mission above personal comfort","Always striving for the best performance","Following the loudest voice in the room"],"Integrity is the foundation of trust. Service Before Self and Excellence describe commitment to the mission and to high performance."],
["What does JADO stand for?",["Joint All-Domain Operations","Joint Air Defense Operations","Joint Allied Domain Operations","Joint Aerospace Deployment Orders"],"JADO is Joint All-Domain Operations: converging effects across domains to create dilemmas for the enemy."],
["Which operational concept employs multi-capable Airmen and supports JADO’s goal?",["Agile Combat Employment (ACE)","Conditions Based Authorities","The Competition Continuum","Unity of Effort"],"ACE is the operational concept that uses multi-capable (mission ready) Airmen to operate in a dispersed, resilient way."],
["Which is an example of mission command?",["A squadron commander clearly gives intent and empowers competent, flexible leaders","Letting flight commanders operate with no guidance or oversight","Giving detailed instructions and allowing no input","Saying “just figure it out” with no timeline"],"Mission command pairs clear intent with empowered subordinates. No guidance or total micromanagement are both failures of it."],
["Which mission command principle gives a clear, concise statement of an operation’s purpose and desired end state?",["Commander’s intent","Disciplined initiative","Risk acceptance","Competent teams"],"Commander’s intent frames purpose, key tasks, and end state so others can act within it."],
["Which term describes airmen trained in expeditionary skills who can perform diverse tasks and are often trained as cross-functional teams to support ACE?",["Mission Ready Airmen (multi-capable Airmen)","Joint task forces","Stakeholders","Component commanders"],"Mission Ready Airmen are cross-trained to support ACE force elements."],
["Which describes Conditions Based Authorities?",["Published authorities delegated down the chain of command and activated only when specified conditions are met","Permanent authorities held only by the SecDef","Orders that never change","Authorities held by allied nations"],"Conditions Based Authorities pre-delegate decisions that take effect only when set conditions occur."],
["ACE is best described as:",["A proactive and reactive scheme of maneuver executed within threat timelines to increase resiliency and survivability while generating combat power","A budgeting process","A fixed defense of a single main base","A cooperation agreement with NATO"],"ACE disperses forces to complicate enemy targeting while keeping combat power."],
["The goal of Agile Combat Employment is to:",["Complicate or negate adversary responses by complicating targeting and creating political and operational dilemmas","Concentrate all aircraft at one base","Eliminate the need for allies","Reduce the size of the force"],"ACE aims to create dilemmas for the enemy and increase friendly survivability."],
["On the competition continuum, relationships with compatible interests that are mutually beneficial are called:",["Cooperation","Competition","Armed conflict","Deterrence"],"Cooperation involves compatible interests and mutual benefit."],
["On the competition continuum, relationships with incompatible interests where none seeks to escalate to armed conflict are called:",["Competition","Cooperation","Armed conflict","Alliance"],"Competition involves incompatible interests below the threshold of armed conflict."],
["On the competition continuum, a situation in which combat is the primary means to satisfy interests is called:",["Armed conflict","Cooperation","Competition","Mutual support"],"Armed conflict is where combat is the main means of pursuing interests."],
["Which Air Force core mission provides access to reliable communications and information networks for joint operations?",["Command and Control","Air and Space Superiority","Rapid Global Mobility","Global Strike"],"Command and Control provides the networks that connect and direct joint forces."],
["Which core mission provides situational awareness and the information decision makers need?",["Intelligence, Surveillance, and Reconnaissance","Global Strike","Rapid Global Mobility","Air and Space Superiority"],"ISR delivers timely, relevant, accurate information to decision makers."],
["Which core mission is control of the air domain, guaranteeing the availability of other core missions to combatant commanders?",["Air and Space Superiority","Command and Control","Global Strike","ISR"],"Controlling the air allows the other core missions to operate."],
["Which core mission quickly projects air power anywhere, providing swift deployment and the ability to sustain operations from combat to humanitarian relief?",["Rapid Global Mobility","Global Strike","ISR","Command and Control"],"Rapid Global Mobility delivers personnel and equipment worldwide."],
["Which core mission is the ability to project military power more rapidly, flexibly, and with a lighter footprint than other options?",["Global Strike","Rapid Global Mobility","ISR","Air and Space Superiority"],"This describes Global Strike per the Air Force description. Confirm with your instructor, since your guide lists it in two places."],
["A person or organization affected by US military actions, who may not share the USG’s goals, is a:",["Stakeholder","Mission partner","Combatant commander","Component"],"Stakeholders affect or are affected by military actions and do not necessarily share goals."],
["An external organization the military works with under an agreement or willing arrangement to advance mutual interests is a:",["Mission partner","Stakeholder","Joint task force","Subunified command"],"Mission partners work with the military by agreement or commitment."],
["Coordination toward common objectives, even among participants not in the same command, is:",["Unity of effort","Chain of command","Mission command","Command and control"],"Unity of effort is the product of successful unified action."],
["Which document was the first constitution of the United States?",["Articles of Confederation","Declaration of Independence","Federalist Papers","Bill of Rights"],"The Articles of Confederation set up the first national government after the Revolution."],
["Which collection of essays by Jay, Madison, and Hamilton urged ratification of the Constitution?",["The Federalist Papers","The Bill of Rights","The Articles of Confederation","The Declaration of Independence"],"The Federalist Papers argued for ratification."],
["Which Constitution article establishes the executive branch?",["Article II","Article I","Article III","Article V"],"Article I is Congress, II the President, III the courts."],
["Which Constitution article describes the process for amending it?",["Article V","Article IV","Article VI","Article VII"],"Article V covers amendments. Article VI is the supremacy clause, and VII is ratification."],
["Providing foreign aid to a partner nation is an example of which instrument of national power?",["Diplomatic","Military","Law enforcement","Intelligence"],"Per your NDS guide, foreign aid is a diplomatic example."],
["Denying individuals or groups access to funding sources is which instrument of national power?",["Financial","Economic","Information","Military"],"Cutting off funding is a financial instrument."],
["Collecting information on a terrorist network is an example of which instrument?",["Intelligence","Law enforcement","Information","Economic"],"Gathering intelligence on threats is the intelligence instrument."],
["Using media and social media to influence public opinion is which instrument?",["Information","Intelligence","Diplomatic","Financial"],"The information instrument shapes opinion and narrative."],
["Which level of warfare integrates national policy into national, defense, and military strategies?",["Strategic","Operational","Tactical","Irregular"],"Strategic ties policy to strategy. Operational applies operational art, and tactical is battles and engagements."],
["Which level of warfare is generally the realm of Combatant Commanders and their subordinate components?",["Operational","Strategic","Tactical","Conventional"],"The operational level applies operational art in a theater."],
["Traditional military operations between nation-states using non-nuclear weapons describe which type of warfare?",["Conventional","Irregular","Strategic","Tactical"],"Irregular warfare involves guerrilla tactics, subversion, or sabotage."],
["What was established in 1947 to coordinate and oversee national security efforts?",["The National Security Council","The Joint Chiefs of Staff","The Department of Homeland Security","US Cyber Command"],"The NSC was created by the National Security Act of 1947."],
["A command with a broad continuing mission under a single commander, with components from two or more Military Departments, is a:",["Combatant Command","Joint Task Force","Service Component Command","Subordinate unified command"],"CCMDs are established by the President through the SecDef, with advice from the Chairman."],
["A command with a limited, specific objective that does not require centralized logistics control is a:",["Joint Task Force","Combatant Command","Geographic combatant command","Service Component Command"],"JTFs are established for a specific limited objective."],
["Which command structure gives one Service operational control of its own forces within a joint force?",["Service Component Command","Joint Task Force","Combatant Command","Functional combatant command"],"Service components are each Service’s command element within a joint force."],
["Which GCC covers the Asia-Pacific?",["INDOPACOM","CENTCOM","EUCOM","AFRICOM"],"INDOPACOM covers the Indo-Pacific."],
["Which GCC covers North America?",["NORTHCOM","SOUTHCOM","EUCOM","INDOPACOM"],"NORTHCOM covers the US, Canada, and Mexico."],
["Which four combatant commands have transregional responsibilities?",["CYBERCOM, SOCOM, STRATCOM, TRANSCOM","CENTCOM, EUCOM, AFRICOM, SOUTHCOM","NORTHCOM, INDOPACOM, SPACECOM, SOCOM","EUCOM, TRANSCOM, CENTCOM, CYBERCOM"],"Per the map on your NMO guide, these four operate across geographic boundaries."]
];
var app=document.getElementById("app"),S={};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function home(){app.innerHTML='<h1>ALS Practice Quiz</h1><p class="sub">Joint Learning Areas 1–3. Study aid only; it is not the real exam.</p><div class="card"><label for="n">How many questions?</label><select id="n"><option value="10">10 (quick check)</option><option value="20">20</option><option value="'+Q.length+'" selected>'+Q.length+' (full set)</option></select><button class="p" id="go">Start quiz</button></div>';
document.getElementById("go").onclick=function(){start(shuf(Q).slice(0,+document.getElementById("n").value))}}
function start(list){S={items:list.map(function(q){var o=shuf(q[1].map(function(t,i){return{t:t,c:i===0}}));return{q:q[0],o:o,e:q[2],a:null}}),i:0};show()}
function show(){var it=S.items[S.i],n=S.items.length;
var h='<div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div><div class="meta">Question '+(S.i+1)+' of '+n+'</div><div class="card"><strong>'+esc(it.q)+'</strong>';
it.o.forEach(function(o,k){var c="o";if(it.a!==null){if(o.c)c+=" ok";else if(k===it.a)c+=" no"}
h+='<button class="'+c+'" data-k="'+k+'"'+(it.a!==null?" disabled":"")+'>'+esc(o.t)+'</button>'});
if(it.a!==null){h+='<div class="ex"><strong>'+(it.o[it.a].c?"Correct. ":"Not quite. ")+'</strong>'+esc(it.e)+'</div><button class="p" id="nx">'+(S.i+1<n?"Next question":"See results")+'</button>'}
h+='</div>';app.innerHTML=h;
Array.prototype.forEach.call(app.querySelectorAll(".o"),function(b){b.onclick=function(){if(it.a===null){it.a=+b.dataset.k;show()}}});
var nx=document.getElementById("nx");if(nx)nx.onclick=function(){S.i++;S.i<n?show():results()}}
function results(){var n=S.items.length,r=S.items.filter(function(x){return x.o[x.a].c}).length,pct=Math.round(r/n*100);
var miss=S.items.filter(function(x){return!x.o[x.a].c});
var h='<h1>Results</h1><div class="card"><div class="big">'+r+' / '+n+' ('+pct+'%)</div><div class="sub">'+(pct>=90?"Excellent. You’re in great shape.":pct>=80?"Solid. Review the misses below.":"Keep going. Study the misses below and retry.")+'</div>';
if(miss.length){h+='<strong>Review your misses</strong>';miss.forEach(function(x){var c=x.o.filter(function(o){return o.c})[0].t;h+='<div class="rev"><div>'+esc(x.q)+'</div><div style="color:var(--no)">Your answer: '+esc(x.o[x.a].t)+'</div><div style="color:var(--ok)">Correct: '+esc(c)+'</div><div class="meta">'+esc(x.e)+'</div></div>'})}
else h+='<p>Perfect score, nothing to review.</p>';
h+='<button class="p" id="again">New quiz</button>'+(miss.length?'<button id="retry">Retry only my misses</button>':'')+'</div>';
app.innerHTML=h;document.getElementById("again").onclick=home;
var rt=document.getElementById("retry");if(rt)rt.onclick=function(){var m=miss.map(function(x){var c=x.o.filter(function(o){return o.c})[0].t;return[x.q,[c].concat(x.o.filter(function(o){return!o.c}).map(function(o){return o.t})),x.e]});start(shuf(m))}}
home();
</script></body></html>
